# config/services.yaml
parameters:
    uploads_dir: '%kernel.project_dir%/public/uploads'
    gemini_api_key: 'AIzaSyDkpz3hYv9nelCGKqiBnlsmpF-5fMsEu9Y'


services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ONLY THIS — fixes the array argument
    Knp\Bundle\PaginatorBundle\Subscriber\SlidingPaginationSubscriber:
        arguments:
            $options:
                pageParameterName: page
                sortFieldParameterName: sort
                sortDirectionParameterName: direction
                filterFieldParameterName: filterField
                filterValueParameterName: filterValue
                distinct: true
                pageOutOfRange: ignore
    App\Service\GeminiChatService:
        arguments:
            $gemini_api_key: '%gemini_api_key%'

