# config/packages/knp_paginator.yaml
knp_paginator:
    page_range: 5                      # Number of pages to show
    default_options:
        page_name: page                # URL parameter for page
        sort_field_name: sort          # URL parameter for sort field
        sort_direction_name: direction # URL parameter for sort direction
        distinct: true                 # Remove duplicates
    template:
        pagination: '@KnpPaginator/Pagination/sliding.html.twig'  # Default template
        sortable: '@KnpPaginator/Pagination/sortable_link.html.twig'